          c.lineJoin = 'round';
          c.strokeStyle = '#78350f';
          c.lineWidth = 18;
          c.beginPath();
          f.pts.forEach((p, idx) => idx === 0 ? c.moveTo(p.x, p.y) : c.lineTo(p.x, p.y));
          c.stroke();

          c.strokeStyle = '#1c1917';
          c.lineWidth = 9;
          c.beginPath();
          f.pts.forEach((p, idx) => idx === 0 ? c.moveTo(p.x, p.y) : c.lineTo(p.x, p.y));
          c.stroke();
          c.restore();
        }

        c.lineCap = 'round';
        for (const r of this.roads) {
          const a = this.getNode(r.a), b = this.getNode(r.b);
          if (!a || !b) continue;
          if (r.bridge) {
            c.strokeStyle = '#78350f'; c.lineWidth = ROAD_W + 10;
            c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
          }
          c.strokeStyle = r.tier === 1 ? '#855834' : (r.tier === 2 ? '#64748b' : (r.tier === 3 ? '#4b5563' : (r.tier === 4 ? '#1e293b' : '#0284c7')));
          c.lineWidth = ROAD_W;
          c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();

          if (r.tier === 5) {
            c.save(); c.strokeStyle = '#38bdf8'; c.lineWidth = 4;
            c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); c.restore();
          } else if (r.tier === 4) {
            c.save(); c.strokeStyle = '#facc15'; c.lineWidth = 2; c.setLineDash([10, 10]);
            c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); c.restore();
          }
        }

        // Dibujar Mini Ciervos
        for (const d of this.deers) {
          c.save();
          c.translate(d.x, d.y);
          c.rotate(d.ang);
          c.fillStyle = '#b45309';
          c.beginPath(); c.ellipse(0, 0, 7, 4, 0, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#fef3c7';
          c.beginPath(); c.arc(-6, 0, 2, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#78350f';
          c.beginPath(); c.arc(7, 0, 3, 0, Math.PI * 2); c.fill();
          c.restore();
        }

        // Dibujar Conejos
        for (const rb of this.rabbits) {
          const bounce = rb.wait <= 0 ? Math.abs(Math.sin(rb.hop)) * 2.5 : 0;
          c.save();
          c.translate(rb.x, rb.y - bounce);
          c.rotate(rb.ang);
          c.fillStyle = '#f8fafc';
          c.beginPath(); c.ellipse(0, 0, 4.2, 2.8, 0, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#fbcfe8';
          c.beginPath(); c.ellipse(2, -1.6, 2.4, 0.9, -0.3, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.ellipse(2,  1.6, 2.4, 0.9,  0.3, 0, Math.PI * 2); c.fill();
          c.restore();
        }

        for (const b of this.bldgs) {
          const sp = ITEMS[b.type];
          if (!sp) continue;
          c.save();
          c.translate(b.x, b.y);
          c.rotate(b.ang);

          this.drawDetailedBuilding(c, b);

          c.rotate(-b.ang);
          const hh = b.h * 0.5, hw = b.w * 0.5;
          if (sp.role && this.workers[sp.role] === 0) {
            c.fillStyle = '#fbbf24';
            c.beginPath(); c.arc(hw - 4, -hh + 4, 6, 0, Math.PI * 2); c.fill();
          }
          if (b.damaged || b.dusty) {
            c.font = '18px sans-serif';
            c.textAlign = 'center';
            c.fillText('🔨', 0, -hh - 6);
          }
          if (b.fire) {
            c.font = '22px sans-serif';
            c.textAlign = 'center';
            c.fillText('🔥', 0, -hh - 8);
          }
          c.restore();
        }

        for (const ag of this.agents) {
          c.save();
          c.translate(ag.x, ag.y);
          c.rotate(ag.ang);
          if (ag.kind === 'fire') {
            c.fillStyle = '#ef4444'; c.beginPath(); c.arc(0, 0, 6, 0, Math.PI * 2); c.fill();
          } else if (ag.kind === 'guard') {
            c.fillStyle = '#2563eb'; c.beginPath(); c.arc(0, 0, 5, 0, Math.PI * 2); c.fill();
          } else if (ag.kind === 'hunter') {
            c.fillStyle = '#15803d'; c.beginPath(); c.arc(0, 0, 5, 0, Math.PI * 2); c.fill();
          } else if (ag.kind === 'car') {
            c.fillStyle = '#facc15'; c.roundRect(-9, -4.5, 18, 9, 3); c.fill();
          } else {
            c.fillStyle = '#f9fafb'; c.beginPath(); c.arc(0, 0, 3.5, 0, Math.PI * 2); c.fill();
          }
          c.restore();
        }

        if (this.gesture && this.gesture.mode === 'road' && this.gesture.roadStart && this.gesture.roadEnd) {
          const s = this.gesture.roadStart, e = this.gesture.roadEnd;
          c.strokeStyle = 'rgba(52, 211, 153, 0.8)';
          c.lineWidth = ROAD_W;
          c.lineCap = 'round';
          c.beginPath(); c.moveTo(s.x, s.y); c.lineTo(e.x, e.y); c.stroke();
        }

        if (this.tornado) {
          const t = this.tornado;
          const maxR = t.strong ? (t.isSand ? 90 : 68) : 46;
          c.save();
          c.translate(t.x, t.y);
          c.rotate(t.angle);
          const arms = t.strong ? 12 : 7;
          for (let a = 0; a < arms; a++) {
            c.save();
            c.rotate((a * Math.PI * 2) / arms);
            c.strokeStyle = t.isSand ? 'rgba(252, 211, 77, 0.85)' : 'rgba(226, 232, 240, 0.85)';
            c.lineWidth = t.strong ? 3.8 : 2.4;
            c.beginPath();
            for (let r = 8; r <= maxR; r += 6) {
              const theta = r * 0.075;
              if (r === 8) c.moveTo(Math.cos(theta) * r, Math.sin(theta) * r);
              else c.lineTo(Math.cos(theta) * r, Math.sin(theta) * r);
            }
            c.stroke();
            c.restore();
          }
          c.restore();
        }

        if (this.tsunamiWave) {
          const w = this.tsunamiWave;
          c.fillStyle = 'rgba(2, 132, 199, 0.85)';
          c.fillRect(w.x, 0, w.width, MAP_H);
          c.fillStyle = 'rgba(224, 242, 254, 0.95)';
          c.fillRect(w.x, 0, 24, MAP_H);
        }

        for (const b of this.weather.bolts) {
          c.save();
          c.strokeStyle = `rgba(254, 249, 195, ${Math.min(1, b.life * 3.5)})`;
          c.lineWidth = 4;
          c.beginPath();
          b.pts.forEach((p, idx) => idx === 0 ? c.moveTo(p.x, p.y) : c.lineTo(p.x, p.y));
          c.stroke();
          c.restore();
        }

        if (night > 0.02) {
          c.save();
          c.fillStyle = `rgba(10, 15, 35, ${night * 0.58})`;
          c.fillRect(0, 0, MAP_W, MAP_H);

          c.globalCompositeOperation = 'lighter';
          for (const b of this.bldgs) {
            if (b.fire) continue;
            const isLamp = b.type === 'street_light';
            const radius = isLamp ? 155 : (this.era >= 3 ? 65 : 35);
            const grad = c.createRadialGradient(b.x, b.y, 4, b.x, b.y, radius);
            grad.addColorStop(0, isLamp ? `rgba(254, 240, 138, ${night * 0.65})` : `rgba(253, 224, 71, ${night * 0.25})`);
            grad.addColorStop(1, 'rgba(253, 224, 71, 0)');
            c.fillStyle = grad;
            c.beginPath();
            c.arc(b.x, b.y, radius, 0, Math.PI * 2);
            c.fill();
          }
          c.restore();
        }

        c.restore();

        if (this.windWarning > 0) {
          c.strokeStyle = 'rgba(241, 245, 249, 0.55)';
          c.lineWidth = 2.2;
          c.beginPath();
          for (const g of this.weather.windGusts) {
            c.moveTo(g.x, g.y);
            c.lineTo(g.x + g.len, g.y + Math.sin(g.x * 0.03) * 6);
          }
          c.stroke();
        }

        if (this.weather.state === 'rain' || this.weather.state === 'storm') {
          c.fillStyle = this.weather.state === 'storm' ? 'rgba(15, 23, 42, 0.28)' : 'rgba(15, 23, 42, 0.15)';
          c.fillRect(0, 0, this.cam.vw, this.cam.vh);
          c.strokeStyle = 'rgba(186, 230, 253, 0.65)';
          c.lineWidth = 1.6;
          c.beginPath();
          for (const d of this.weather.drops) {
            c.moveTo(d.x, d.y);
            c.lineTo(d.x - d.l * 0.22, d.y + d.l);
          }
          c.stroke();
        }

        if (this.sandIntensity > 0.05) {
          c.fillStyle = `rgba(217, 119, 6, ${this.sandIntensity * 0.35})`;
          c.fillRect(0, 0, this.cam.vw, this.cam.vh);
          c.fillStyle = 'rgba(251, 191, 36, 0.65)';
          for (const p of this.weather.sandParticles) {
            c.beginPath(); c.arc(p.x, p.y, p.size, 0, Math.PI * 2); c.fill();
          }
        }

        if (this.weather.lightningFlash > 0) {
          c.fillStyle = `rgba(255, 255, 255, ${this.weather.lightningFlash * 0.85})`;
          c.fillRect(0, 0, this.cam.vw, this.cam.vh);
        }
      }

      drawMini() {
        const m = this.mctx, mw = this.mini.width, mh = this.mini.height;
        const sx = mw / MAP_W, sy = mh / MAP_H;
        m.clearRect(0, 0, mw, mh);
        m.drawImage(this.bg, 0, 0, mw, mh);

        m.strokeStyle = '#f3f4f6'; m.lineWidth = 1.5;
        for (const r of this.roads) {
          const a = this.getNode(r.a), b = this.getNode(r.b);
          if (!a || !b) continue;
          m.beginPath(); m.moveTo(a.x * sx, a.y * sy); m.lineTo(b.x * sx, b.y * sy); m.stroke();
        }
        for (const b of this.bldgs) {
          m.fillStyle = b.fire ? '#ef4444' : (b.damaged ? '#f97316' : '#fbbf24');
          m.fillRect(b.x * sx - 2, b.y * sy - 2, 4, 4);
        }
        m.strokeStyle = '#38bdf8'; m.lineWidth = 1.8;
        m.strokeRect((this.cam.x - this.cam.vw * 0.5) * sx, (this.cam.y - this.cam.vh * 0.5) * sy, this.cam.vw * sx, this.cam.vh * sy);
      }

      renderCards() {
        const box = document.getElementById('cards');
        box.innerHTML = '';
        for (const [k, it] of Object.entries(ITEMS)) {
          if (it.sec !== this.sec) continue;
          const lock = it.era > this.era;
          const b = document.createElement('button');
          b.className = 'card' + (this.item === k ? ' active' : '') + (lock ? ' locked' : '');
          b.innerHTML = `
            <span class="card-ico">${lock ? '🔒' : it.ico}</span>
            <span class="card-lbl">${it.name}</span>
            <span class="card-prc">${this.costText(it.cost)}</span>
          `;
          b.onclick = () => {
            if (lock) { this.showBanner(`🔒 ${ERAS[it.era].name} (${ERAS[it.era - 1].reqPop} hab.)`); return; }
            this.item = k;
            this.renderCards();
          };
          box.appendChild(b);
        }
      }

      renderWorkers() {
        const list = document.getElementById('roles-list');
        list.innerHTML = '';
        const slots = this.getSlots();
        const free = Math.max(0, Math.floor(this.pop) - Object.values(this.workers).reduce((a, b) => a + b, 0));
        document.getElementById('w-free').textContent = String(free);

        for (const [k, r] of Object.entries(ROLES)) {
          const cur = this.workers[k] || 0, max = slots[k] || 0;
          const row = document.createElement('div');
          row.className = 'role-row';
          row.innerHTML = `
            <span>${r.ico} ${r.name}</span>
            <div class="stepper">
              <button class="step-btn" data-r="${k}" data-d="-1" ${cur <= 0 ? 'disabled' : ''}>−</button>
              <span style="min-width:36px;text-align:center;">${cur}/${max}</span>
              <button class="step-btn" data-r="${k}" data-d="1" ${(cur >= max || free <= 0) ? 'disabled' : ''}>+</button>
            </div>
          `;
          list.appendChild(row);
        }
      }

      updateHUD() {
        const e = ERAS[this.era];
        const s = SEASONS[this.seasonIdx] || SEASONS[0];
        const hr = Math.floor(this.timeOfDay).toString().padStart(2, '0');
        const min = Math.floor((this.timeOfDay % 1) * 60).toString().padStart(2, '0');
        const dayIco = this.getNightFactor() > 0.4 ? '🌙' : '☀️';

        document.getElementById('era-pill').textContent = `${e.ico} Era ${['I','II','III','IV'][this.era - 1]}`;
        document.getElementById('time-pill').textContent = `${dayIco} ${hr}:${min} · ${s.ico} ${Math.round(this.temperature)}°C`;
        document.getElementById('v-gold').textContent   = Math.floor(this.res.gold);
        document.getElementById('v-wood').textContent   = Math.floor(this.res.wood);
        document.getElementById('v-stone').textContent  = Math.floor(this.res.stone);
        document.getElementById('v-metal').textContent  = Math.floor(this.res.metal);
        document.getElementById('v-copper').textContent = Math.floor(this.res.copper);
        document.getElementById('v-food').textContent   = Math.floor(this.res.food);
        document.getElementById('v-pop').textContent    = `${Math.floor(this.pop)}/${this.popCap}`;
        const free = Math.max(0, Math.floor(this.pop) - Object.values(this.workers).reduce((a, b) => a + b, 0));
        document.getElementById('v-free').textContent = String(free);
        document.getElementById('btn-era').textContent = e.reqPop ? `⚔️ ${e.next}: ${e.reqPop}👥` : '🚀 Era IV';

        const wBtn = document.getElementById('btn-weather');
        wBtn.classList.toggle('active', this.weather.mode === 'manual' || this.activeDisaster !== null);
        wBtn.textContent = this.activeDisaster ? '⚡ Activo' : (this.weather.mode === 'manual' ? '🔧 Manual' : '☀️ Clima');
      }

      showBanner(msg) {
        const el = document.getElementById('banner');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(this.bannerTimer);
        this.bannerTimer = setTimeout(() => el.classList.remove('show'), 3600);
      }

      openRegionModal(boot = false) {
        const m = document.getElementById('modal');
        document.getElementById('modal-title').textContent = '🗺️ Elige tu Región';
        let sel = this.regId;
        const draw = () => {
          document.getElementById('modal-body').innerHTML = `<div class="reg-grid">${Object.values(REGIONS).map(r => `
            <button type="button" class="reg-btn ${sel === r.id ? 'selected' : ''}" data-id="${r.id}">
              <span style="font-size:32px;">${r.icon}</span>
              <span>${r.name}</span>
            </button>
          `).join('')}</div>`;
          document.querySelectorAll('.reg-btn').forEach(b => {
            b.onclick = () => { sel = b.dataset.id; draw(); };
          });
        };
        draw();
        document.getElementById('modal-cancel').style.display = boot ? 'none' : 'inline-flex';
        document.getElementById('modal-ok').textContent = '¡Empezar!';
        document.getElementById('modal-ok').onclick = () => {
          localStorage.removeItem(SAVE_KEY);
          this.initWorld(sel);
          this.sec = 'roads';
          this.item = 'dirt_road';
          this.renderCards();
          this.renderWorkers();
          this.updateHUD();
          m.classList.add('hidden');
        };
        m.classList.remove('hidden');
      }

      openEraModal() {
        const e = ERAS[this.era];
        if (!e.reqPop) {
          this.showBanner('🚀 ¡Ya estás en la Era IV · Futura!');
          return;
        }
        const faltan = Math.max(0, e.reqPop - Math.floor(this.pop));
        this.showBanner(`⚔️ ${e.next} se desbloquea automáticamente al llegar a ${e.reqPop} habitantes (faltan ${faltan})`);
      }

      openTradeModal() {
        const m = document.getElementById('modal');
        document.getElementById('modal-title').textContent = '🌐 Comercio Libre entre Regiones';
        const hasPort = this.bldgs.some(b => b.type === 'trade_post' && !b.fire);
        const offers = [
          { reg: '🌲 Bosque Norte', give: 'wood',   giveAmt: 40, get: 'gold',   getAmt: 120, label: 'Vender 40 🪵 por 120 🪙' },
          { reg: '🏜️ Meseta Dorada', give: 'stone',  giveAmt: 35, get: 'copper', getAmt: 25,  label: 'Cambiar 35 🪨 por 25 🟠' },
          { reg: '🌊 Costa Azul',    give: 'food',   giveAmt: 40, get: 'metal',  getAmt: 25,  label: 'Cambiar 40 🌾 por 25 ⚙️' },
          { reg: '🌲 Bosque Norte',  give: 'gold',   giveAmt: 160,get: 'metal',  getAmt: 30,  label: 'Comprar 30 ⚙️ por 160 🪙' },
          { reg: '🏜️ Meseta Dorada', give: 'gold',   giveAmt: 160,get: 'copper', getAmt: 30,  label: 'Comprar 30 🟠 por 160 🪙' },
          { reg: '🌊 Costa Azul',    give: 'copper', giveAmt: 20, get: 'gold',   getAmt: 180, label: 'Exportar 20 🟠 por 180 🪙' }
        ];

        const renderBody = () => {
          document.getElementById('modal-body').innerHTML = `
            <div style="font-size:13px;color:#9ca3af;text-align:center;margin-bottom:12px;">
              ${hasPort ? '✅ Ruta Regional activa (precios preferenciales)' : '💡 Consejo: Construye una 🌐 Ruta Regional en Servicios para ganar oro pasivo'}
            </div>
            ${offers.map((o, idx) => `
              <div class="trade-row">
                <div>
                  <div style="color:#fbbf24;font-size:12px;">${o.reg}</div>
                  <div>${o.label}</div>
                </div>
                <button type="button" class="icon-btn gold" data-idx="${idx}" ${this.res[o.give] < o.giveAmt ? 'disabled style="opacity:0.4;"' : ''}>Intercambiar</button>
              </div>
            `).join('')}
          `;
          document.querySelectorAll('#modal-body button[data-idx]').forEach(btn => {
            btn.onclick = () => {
              const o = offers[Number(btn.dataset.idx)];
              if (this.res[o.give] < o.giveAmt) return;
              this.res[o.give] -= o.giveAmt;
              this.res[o.get]  += o.getAmt;
              this.updateHUD();
              this.showBanner(`🌐 Intercambio completado con ${o.reg}`);
              renderBody();
            };
          });
        };
        renderBody();
        document.getElementById('modal-cancel').style.display = 'inline-flex';
        document.getElementById('modal-ok').textContent = 'Listo';
        document.getElementById('modal-ok').onclick = () => m.classList.add('hidden');
        m.classList.remove('hidden');
      }

      save(silent = false) {
        try {
          const data = {
            uid: this.uid,
            regId: this.regId,
            era: this.era,
            timeOfDay: this.timeOfDay,
            seasonIdx: this.seasonIdx,
            res: this.res,
            pop: this.pop,
            workers: this.workers,
            nodes: this.nodes,
            roads: this.roads,
            bldgs: this.bldgs,
            fissures: this.fissures
          };
          localStorage.setItem(SAVE_KEY, JSON.stringify(data));
          if (!silent) this.showBanner('💾 ¡Ciudad guardada!');
        } catch (err) {
          console.error(err);
        }
      }

      load(silent = false) {
        try {
          const raw = localStorage.getItem(SAVE_KEY);
          if (!raw) return false;
          const d = JSON.parse(raw);
          if (!d || !d.regId) return false;
          this.initWorld(d.regId);
          this.uid = d.uid || 1;
          this.era = d.era || 1;
          this.timeOfDay = d.timeOfDay ?? 10.0;
          this.seasonIdx = d.seasonIdx || 0;
          this.res = Object.assign({ gold: 700, wood: 150, stone: 100, metal: 25, copper: 25, food: 60 }, d.res || {});
          this.pop = d.pop || 0;
          this.workers = Object.assign({ wood: 0, stone: 0, farm: 0, hunter: 0, eng: 0, guard: 0, fire: 0, civic: 0 }, d.workers || {});
          this.nodes = d.nodes || [];
          this.roads = d.roads || [];
          this.bldgs = d.bldgs || [];
          this.fissures = d.fissures || [];
          this.bgDirty = true;
          this.recalcPop();
          this.checkEraProgression();
          if (!silent) this.showBanner('📂 Ciudad cargada');
          return true;
        } catch (err) {
          console.error(err);
          return false;
        }
      }

      resize() {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        this.cam.vw = window.innerWidth;
        this.cam.vh = window.innerHeight;
        this.canvas.width = Math.round(this.cam.vw * dpr);
        this.canvas.height = Math.round(this.cam.vh * dpr);
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      bindEvents() {
        window.addEventListener('resize', () => this.resize());

        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.sec = btn.dataset.sec;
            const first = Object.keys(ITEMS).find(k => ITEMS[k].sec === this.sec && ITEMS[k].era <= this.era);
            if (first) this.item = first;
            this.renderCards();
          };
        });

        document.getElementById('btn-workers').onclick = () => {
          document.getElementById('workers-drawer').classList.toggle('open');
          this.renderWorkers();
        };

        document.getElementById('btn-auto').onclick = () => this.autoWorkers();

        document.getElementById('roles-list').onclick = e => {
          const btn = e.target.closest('.step-btn');
          if (!btn || btn.disabled) return;
          const r = btn.dataset.r;
          const d = parseInt(btn.dataset.d, 10);
          const slots = this.getSlots();
          const free = Math.max(0, Math.floor(this.pop) - Object.values(this.workers).reduce((a, b) => a + b, 0));
          if (d > 0 && free > 0 && this.workers[r] < slots[r]) this.workers[r]++;
          if (d < 0 && this.workers[r] > 0) this.workers[r]--;
          this.renderWorkers();
          this.updateHUD();
        };

        document.getElementById('btn-era').onclick = () => this.openEraModal();
        document.getElementById('btn-trade').onclick = () => this.openTradeModal();
        document.getElementById('btn-weather').onclick = () => this.toggleWeatherMode();

        document.getElementById('btn-disasters').onclick = () => {
          const bar = document.getElementById('disasters-bar');
          bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
        };

        document.getElementById('btn-close-disasters').onclick = () => {
          document.getElementById('disasters-bar').style.display = 'none';
        };

        document.getElementById('btn-undo').onclick = () => this.undoLast();
        document.getElementById('btn-rotate').onclick = () => {
          this.rot = (this.rot + Math.PI * 0.25) % (Math.PI * 2);
          this.showBanner('↻ Edificio rotado');
        };

        document.getElementById('btn-speed').onclick = e => {
          this.speed = this.speed === 1 ? 2 : (this.speed === 2 ? 0 : 1);
          e.currentTarget.textContent = this.speed === 0 ? '⏸️' : (this.speed === 2 ? '⏩' : '▶️');
        };

        document.getElementById('btn-export').onclick = () => this.save(false);
        document.getElementById('btn-region').onclick = () => this.openRegionModal(false);
        document.getElementById('modal-cancel').onclick = () => document.getElementById('modal').classList.add('hidden');

        const jumpMini = e => {
          const rect = this.mini.getBoundingClientRect();
          const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
          const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
          this.cam.x = Math.max(200, Math.min(MAP_W - 200, (cx / rect.width) * MAP_W));
          this.cam.y = Math.max(150, Math.min(MAP_H - 150, (cy / rect.height) * MAP_H));
          this.cam.vx = 0;
          this.cam.vy = 0;
        };
        this.mini.addEventListener('pointerdown', e => {
          e.stopPropagation();
          jumpMini(e);
        });

        this.canvas.addEventListener('pointerdown', e => {
          this.canvas.setPointerCapture(e.pointerId);
          this.touches.set(e.pointerId, { x: e.clientX, y: e.clientY });

          if (this.touches.size >= 2) {
            const pts = Array.from(this.touches.values());
            this.gesture = {
              mode: 'pan',
              cx: (pts[0].x + pts[1].x) * 0.5,
              cy: (pts[0].y + pts[1].y) * 0.5
            };
            return;
          }

          const w = this.toWorld(e.clientX, e.clientY);
          const spec = ITEMS[this.item];

          if (e.button === 2 || e.shiftKey) {
            this.gesture = { mode: 'pan', cx: e.clientX, cy: e.clientY, lastT: performance.now() };
          } else if (spec && spec.kind === 'road') {
            const snap = this.snapPoint(w.x, w.y);
            this.gesture = {
              mode: 'road',
              sx: e.clientX,
              sy: e.clientY,
              roadStart: snap,
              roadEnd: snap
            };
          } else {
            this.gesture = {
              mode: 'tap_or_pan',
              sx: e.clientX,
              sy: e.clientY,
              cx: e.clientX,
              cy: e.clientY,
              moved: false,
              lastT: performance.now()
            };
          }
        });

        this.canvas.addEventListener('pointermove', e => {
          if (!this.touches.has(e.pointerId) || !this.gesture) return;
          this.touches.set(e.pointerId, { x: e.clientX, y: e.clientY });

          if (this.touches.size >= 2) {
            const pts = Array.from(this.touches.values());
            const ncx = (pts[0].x + pts[1].x) * 0.5;
            const ncy = (pts[0].y + pts[1].y) * 0.5;
            if (this.gesture.mode === 'pan') {
              this.cam.x -= (ncx - this.gesture.cx);
              this.cam.y -= (ncy - this.gesture.cy);
            }
            this.gesture = { mode: 'pan', cx: ncx, cy: ncy };
            return;
          }

          if (this.gesture.mode === 'road') {
            const w = this.toWorld(e.clientX, e.clientY);
            this.gesture.roadEnd = this.snapPoint(w.x, w.y);
          } else if (this.gesture.mode === 'pan' || this.gesture.mode === 'tap_or_pan') {
            const dx = e.clientX - this.gesture.cx;
            const dy = e.clientY - this.gesture.cy;
            if (dist(e.clientX, e.clientY, this.gesture.sx, this.gesture.sy) > 12) {
              this.gesture.moved = true;
              this.gesture.mode = 'pan';
            }
            if (this.gesture.mode === 'pan') {
              const now = performance.now();
              const dt = Math.max(0.008, (now - (this.gesture.lastT || now)) / 1000);
              this.cam.x -= dx;
              this.cam.y -= dy;
              this.cam.vx = -dx / dt * 0.35;
              this.cam.vy = -dy / dt * 0.35;
              this.gesture.cx = e.clientX;
              this.gesture.cy = e.clientY;
              this.gesture.lastT = now;
            }
          }
        });

        const endPointer = e => {
          this.touches.delete(e.pointerId);
          if (!this.gesture) return;

          if (this.gesture.mode === 'road' && this.gesture.roadStart && this.gesture.roadEnd) {
            const spec = ITEMS[this.item];
            if (spec && spec.kind === 'road') {
              this.buildRoadSegment(this.gesture.roadStart, this.gesture.roadEnd, spec);
            }
          } else if (this.gesture.mode === 'tap_or_pan' && !this.gesture.moved) {
            const w = this.toWorld(e.clientX, e.clientY);
            const spec = ITEMS[this.item];
            if (spec && spec.kind === 'bldg') {
              this.placeBldg(w.x, w.y);
            } else if (spec && spec.kind === 'tool') {
              this.useTool(w.x, w.y);
            }
          }

          if (this.touches.size === 0) {
            this.gesture = null;
          }
        };

        this.canvas.addEventListener('pointerup', endPointer);
        this.canvas.addEventListener('pointercancel', endPointer);
        this.canvas.addEventListener('contextmenu', e => e.preventDefault());
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.game = new Game();
    });
  </script>
</body>
</html>
